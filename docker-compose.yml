version: '3.8'

services:
  # 🎮 Game Server (Express + WebSocket + SQLite nhúng + Web Static)
  gamevps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamevps_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 🌐 Cloudflare Tunnel (Tùy chọn: Mở game ra toàn cầu miễn phí, có HTTPS/WSS, không cần mở port)
  # Bỏ comment và điền TUNNEL_TOKEN của bạn vào nếu muốn public game ra Internet:
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: gamevps_tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=your_cloudflare_tunnel_token_here
  #   depends_on:
  #     - gamevps
